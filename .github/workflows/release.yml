name: Build & Release MSIX

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      PLATFORM: x64
      VERSION: 1.0.${{ github.run_number }}.0
      TAG: v1.0.${{ github.run_number }}
      MANIFEST: Package/AppxManifest.template.xml
      OUT_DIR: ${{ github.workspace }}\release-out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test
        run: dotnet test tests/HagizraWidget.Tests -c Release

      # One fixed certificate for every release: users trust it once and later updates install silently.
      - name: Load signing certificate
        id: cert
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Secrets SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD are not set for this repository.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGNING_PFX_PASSWORD)
          Write-Host "Certificate: $($cert.Subject)  $($cert.Thumbprint)  until $($cert.NotAfter)"

          # Public part, published for the manual install.
          New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $env:OUT_DIR 'HagizraWidget.cer'), $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }

          # The manifest Publisher must equal the certificate subject, or Windows refuses the package.
          $publisher = ([xml](Get-Content $env:MANIFEST -Raw -Encoding utf8)).Package.Identity.Publisher
          if ($publisher -ne $cert.Subject) {
            throw "Manifest Publisher '$publisher' must equal the certificate subject '$($cert.Subject)'."
          }

          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build package, dependency and .appinstaller
        run: ./tools/build-release.ps1 -Version $env:VERSION -Repository ${{ github.repository }} -OutDir $env:OUT_DIR -Platform $env:PLATFORM

      - name: Sign
        env:
          PFX: ${{ steps.cert.outputs.pfx }}
          SIGNTOOL: ${{ steps.cert.outputs.signtool }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # Timestamped, so packages stay installable after the certificate expires; retry on flaky servers.
          $servers = 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com', 'http://timestamp.globalsign.com/tsa/r6advanced1'
          $msix = Get-ChildItem $env:OUT_DIR -Filter 'HagizraWidget_*.msix' | Select-Object -First 1
          $signed = $false
          foreach ($ts in $servers) {
            & $env:SIGNTOOL sign /fd SHA256 /f $env:PFX /p $env:SIGNING_PFX_PASSWORD /tr $ts /td SHA256 $msix.FullName
            if ($LASTEXITCODE -eq 0) { $signed = $true; break }
            Write-Host "Signing with timestamp server $ts failed; trying the next one."
          }
          if (-not $signed) { throw "signtool failed for $($msix.Name)" }

      - name: Remove signing key
        if: always()
        env:
          PFX: ${{ steps.cert.outputs.pfx }}
        run: if ($env:PFX -and (Test-Path $env:PFX)) { Remove-Item $env:PFX -Force }

      - name: Write release notes
        run: |
          $latest = "https://github.com/${{ github.repository }}/releases/latest/download"
          $msg = git log -1 --pretty=format:%B
          $notes = @(
            "## גרסה $env:VERSION"
            ''
            '### שינויים'
            $msg
            ''
            '### התקנה'
            "להתקנה עם עדכונים אוטומטיים של Windows: ``Add-AppxPackage -AppInstallerFile $latest/HagizraWidget.appinstaller``"
            'התקנה ידנית: להוריד את כל הקבצים לאותה תיקייה ולהריץ ``powershell -ExecutionPolicy Bypass -File .\install.ps1``.'
            ''
            '### עדכונים'
            'הווידג''ט מתעדכן מעצמו כשיוצאת גרסה חדשה, גם ברשתות מסוננות.'
            ''
            "Commit: $env:GITHUB_SHA"
          )
          $notes -join "`n" | Set-Content (Join-Path $env:RUNNER_TEMP 'notes.md') -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: גרסה ${{ env.TAG }}
          body_path: ${{ runner.temp }}/notes.md
          files: release-out/*
          fail_on_unmatched_files: true
          make_latest: true
